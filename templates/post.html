<article class="blog-post">
    <header class="post-header">
        <h1 class="post-title">{{TITLE}}</h1>
        {{DATE}}
    </header>
    
    <div class="post-content">
        {{CONTENT}}
    </div>
    
    <div class="post-meta">
        {{CATEGORIES}}
        {{TAGS}}
    </div>
    
    {{NAVIGATION}}
    
    <div class="post-footer">
        <a href="/index.html" class="back-link">← חזרה לכל הפוסטים</a>
    </div>
</article>
