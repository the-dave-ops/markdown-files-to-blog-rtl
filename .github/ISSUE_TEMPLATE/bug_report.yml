name: Bug Report
description: Create a report to help us improve the RTL Blog Site Generator
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        If this is a security vulnerability, please refer to our [Security Policy](../../SECURITY.md) instead of opening a public issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what went wrong...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What steps did you take before encountering the issue?
      placeholder: |
        1. Create a markdown file with '...'
        2. Run 'npm run build'
        3. Open '...' in the browser
        4. See error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Details about your environment.
      placeholder: |
        - Version / Commit:
        - Node.js version:
        - Deployment: GitHub Pages / Cloudflare Pages / Docker / Local
        - OS / Browser:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please paste any build output or browser console errors here.
      render: shell
